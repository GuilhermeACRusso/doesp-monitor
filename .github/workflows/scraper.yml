name: DOESP Monitor

on:
  schedule:
    # 10:30 UTC = 07:30 BRT (antes da publicação das ~08h)
    # Ajustar para 12:00 UTC = 09:00 BRT se publicação atrasar
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests pdfplumber "pdfminer.six>=20221105" playwright

      - name: Install Playwright + Chromium
        # --with-deps instala todas as dependências de sistema (libglib2, libnss, etc.)
        run: playwright install chromium --with-deps

      - name: Run DOESP Monitor
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
